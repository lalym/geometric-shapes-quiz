<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Геометрические фигуры — игра-викторина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#1798e8;
    --pink:#ffbeff;
    --hot-pink:#ff42e7;
    --yellow:#ffe500;
    --ink:#141414;
    --paper:#ffffff;
    --green:#3ddc84;
    --red:#ff5a5a;
    --bw:3px;
    --push:7px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Rubik','Segoe UI',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ---------- floating background shapes ---------- */
  .bg-shapes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bg-shape{position:absolute;mix-blend-mode:multiply;opacity:.85;will-change:transform}

  /* ---------- layout ---------- */
  .stage{
    position:relative;z-index:1;
    max-width:760px;margin:0 auto;
    min-height:100vh;
    display:flex;flex-direction:column;
    padding:24px 20px 48px;
  }

  /* ---------- 3D push button ---------- */
  .push-btn{
    font-family:inherit;font-weight:700;font-size:1.15rem;
    background:var(--paper);color:var(--ink);
    border:var(--bw) solid var(--ink);
    border-radius:18px;
    padding:16px 22px;
    cursor:pointer;
    transform:translate(calc(var(--push)*-1),calc(var(--push)*-1));
    box-shadow:var(--push) var(--push) 0 0 var(--ink);
    transition:transform .08s ease, box-shadow .08s ease, background .15s ease;
    user-select:none;
  }
  .push-btn:hover{background:var(--yellow)}
  .push-btn:active{transform:translate(0,0);box-shadow:0 0 0 0 var(--ink)}
  .push-btn:disabled{cursor:default}

  /* ---------- screens ---------- */
  .screen{display:none;flex-direction:column;align-items:center;gap:26px;flex:1;justify-content:center;animation:screenIn .45s cubic-bezier(.34,1.56,.64,1) both}
  .screen.active{display:flex}
  @keyframes screenIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

  h1.logo{
    font-weight:900;text-align:center;line-height:1.02;
    font-size:clamp(2.4rem,7vw,4.2rem);
    letter-spacing:-.02em;text-transform:uppercase;
  }
  h1.logo .hollow{
    color:transparent;
    -webkit-text-stroke:2.5px var(--ink);
  }
  h1.logo .fill-yellow{background:var(--yellow);padding:0 .18em;border-radius:.2em;display:inline-block;transform:rotate(-2deg)}
  .subtitle{font-size:1.15rem;font-weight:500;text-align:center;max-width:460px}

  .menu{display:flex;flex-direction:column;gap:20px;width:min(420px,100%)}
  .menu .push-btn{width:100%;text-align:left;display:flex;align-items:center;gap:14px}
  .menu .push-btn small{display:block;font-weight:500;font-size:.85rem;opacity:.65}
  .chip{
    width:38px;height:38px;flex:none;border:var(--bw) solid var(--ink);border-radius:12px;
    display:grid;place-items:center;font-size:1.1rem;font-weight:900;
  }
  .chip.c1{background:var(--cyan);color:#fff}
  .chip.c2{background:var(--pink)}
  .chip.c3{background:var(--yellow)}

  .mode-toggle{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .mode-toggle .push-btn{font-size:1rem;padding:12px 18px;border-radius:80px}
  .mode-toggle .push-btn.selected{background:var(--cyan);color:#fff}

  /* ---------- HUD ---------- */
  .hud{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .hud .stat{display:flex;flex-direction:column;gap:2px}
  .hud .stat .label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;opacity:.6}
  .hud .stat .value{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .progress{flex:1;display:flex;gap:6px;align-items:center;padding-bottom:6px}
  .progress .dot{height:12px;flex:1;border:2.5px solid var(--ink);border-radius:80px;background:var(--paper);transition:background .25s}
  .progress .dot.done{background:var(--green)}
  .progress .dot.miss{background:var(--red)}
  .progress .dot.now{background:var(--yellow);animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.15)}}

  /* ---------- question card ---------- */
  .question{
    width:100%;background:var(--paper);
    border:var(--bw) solid var(--ink);border-radius:26px;
    box-shadow:12px 12px 0 0 var(--ink);
    padding:28px 24px 30px;
    display:flex;flex-direction:column;align-items:center;gap:18px;
  }
  .q-text{font-size:clamp(1.25rem,3.5vw,1.7rem);font-weight:900;text-align:center}
  .q-text em{font-style:normal;background:var(--pink);padding:0 .2em;border-radius:.2em}
  .figure-frame{
    width:min(280px,70vw);aspect-ratio:1;
    border:var(--bw) solid var(--ink);border-radius:22px;
    background:
      linear-gradient(#eef6fb 1.5px,transparent 1.5px) 0 0/100% 24px,
      linear-gradient(90deg,#eef6fb 1.5px,transparent 1.5px) 0 0/24px 100%,
      #fff;
    display:grid;place-items:center;overflow:hidden;
  }
  .figure-frame img{max-width:92%;max-height:92%;object-fit:contain;filter:drop-shadow(3px 4px 0 rgba(20,20,20,.12))}
  .figure-frame.pop img{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes popIn{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
  .figure-frame.happy img{animation:happy .6s cubic-bezier(.34,1.56,.64,1)}
  @keyframes happy{30%{transform:scale(1.18) rotate(5deg)}60%{transform:scale(.94) rotate(-4deg)}100%{transform:none}}

  /* ---------- answers ---------- */
  .answers{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:20px 22px}
  @media (max-width:520px){.answers{grid-template-columns:1fr}}
  .answers .push-btn{width:100%;text-align:center;position:relative}
  .answers .push-btn.correct{background:var(--green);color:#fff;animation:winPulse .5s cubic-bezier(.34,1.56,.64,1)}
  .answers .push-btn.wrong{background:var(--red);color:#fff;animation:shake .45s}
  .answers .push-btn.dim{opacity:.45}
  @keyframes winPulse{40%{transform:translate(calc(var(--push)*-1),calc(var(--push)*-1)) scale(1.07)}}
  @keyframes shake{20%,60%{transform:translate(calc(var(--push)*-1 - 7px),calc(var(--push)*-1))}40%,80%{transform:translate(calc(var(--push)*-1 + 7px),calc(var(--push)*-1))}}

  .picture-answers .push-btn{padding:12px;background:var(--paper)}
  .picture-answers .push-btn:hover{background:#fff}
  .picture-answers img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}

  .feedback{min-height:2rem;font-weight:900;font-size:1.25rem;text-align:center}
  .feedback.good{color:#0d9e57}
  .feedback.bad{color:var(--red)}

  /* ---------- result ---------- */
  .result-card{
    width:min(480px,100%);background:var(--paper);
    border:var(--bw) solid var(--ink);border-radius:26px;
    box-shadow:16px 16px 0 0 var(--ink);
    padding:36px 28px;text-align:center;
    display:flex;flex-direction:column;gap:18px;align-items:center;
    animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes bounceIn{from{transform:scale(.4);opacity:0}60%{transform:scale(1.06)}to{transform:scale(1);opacity:1}}
  .stars{display:flex;gap:10px;font-size:3rem;line-height:1}
  .stars span{display:inline-block;animation:starPop .5s cubic-bezier(.34,1.56,.64,1) both}
  .stars span:nth-child(2){animation-delay:.18s}
  .stars span:nth-child(3){animation-delay:.36s}
  .stars .off{filter:grayscale(1);opacity:.25}
  @keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
  .big-score{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums}
  .big-score small{font-size:1.4rem;opacity:.5}

  /* ---------- confetti ---------- */
  .confetti{position:fixed;z-index:50;pointer-events:none;top:0;left:0}

  footer{position:relative;z-index:1;text-align:center;font-size:.8rem;opacity:.55;padding-top:26px;font-weight:500}
</style>
</head>
<body>
<div class="bg-shapes" id="bgShapes"></div>

<div class="stage">

  <!-- ===== START ===== -->
  <section class="screen active" id="screen-start">
    <h1 class="logo">Геометри&shy;ческие<br><span class="hollow">фигуры</span><br><span class="fill-yellow">викторина</span></h1>
    <p class="subtitle">Узнавай фигуры с плаката и отвечай на вопросы. Выбери режим игры и раздел!</p>

    <div class="mode-toggle" id="modeToggle">
      <button class="push-btn selected" data-mode="name">Угадай название</button>
      <button class="push-btn" data-mode="picture">Найди фигуру</button>
    </div>

    <div class="menu">
      <button class="push-btn" data-set="flat">
        <span class="chip c1">▲</span>
        <span>Плоские фигуры<small>10 фигур: круг, квадрат, овал…</small></span>
      </button>
      <button class="push-btn" data-set="solid">
        <span class="chip c2">◆</span>
        <span>Объёмные фигуры<small>8 фигур: куб, сфера, конус…</small></span>
      </button>
      <button class="push-btn" data-set="all">
        <span class="chip c3">★</span>
        <span>Все фигуры сразу<small>12 случайных вопросов</small></span>
      </button>
    </div>
  </section>

  <!-- ===== GAME ===== -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="stat"><span class="label">Очки</span><span class="value" id="hudScore">0</span></div>
      <div class="progress" id="hudProgress"></div>
      <div class="stat" style="text-align:right"><span class="label">Вопрос</span><span class="value" id="hudStep">1/10</span></div>
    </div>

    <div class="question">
      <div class="q-text" id="qText"></div>
      <div class="figure-frame" id="qFrame"><img id="qImg" alt="Геометрическая фигура"></div>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <!-- ===== RESULT ===== -->
  <section class="screen" id="screen-result">
    <div class="result-card">
      <div class="stars" id="stars"></div>
      <div class="big-score" id="finalScore"></div>
      <p class="subtitle" id="finalText"></p>
      <button class="push-btn" id="btnAgain" style="background:var(--yellow)">Играть снова</button>
      <button class="push-btn" id="btnMenu">В меню</button>
    </div>
  </section>

  <footer>Картинки взяты с учебного плаката «Геометрические фигуры»</footer>
</div>

<script>
/* ================= DATA ================= */
const SHAPES = [
  {id:'treugolnik',      name:'Треугольник',      set:'flat'},
  {id:'kvadrat',         name:'Квадрат',          set:'flat'},
  {id:'oval',            name:'Овал',             set:'flat'},
  {id:'pryamougolnik',   name:'Прямоугольник',    set:'flat'},
  {id:'krug',            name:'Круг',             set:'flat'},
  {id:'romb',            name:'Ромб',             set:'flat'},
  {id:'trapeciya',       name:'Трапеция',         set:'flat'},
  {id:'pyatiugolnik',    name:'Пятиугольник',     set:'flat'},
  {id:'parallelogramm',  name:'Параллелограмм',   set:'flat'},
  {id:'tor',             name:'Тор',              set:'flat'},
  {id:'konus',           name:'Конус',            set:'solid'},
  {id:'cilindr',         name:'Цилиндр',          set:'solid'},
  {id:'sfera',           name:'Сфера',            set:'solid'},
  {id:'piramida',        name:'Пирамида',         set:'solid'},
  {id:'kub',             name:'Куб',              set:'solid'},
  {id:'ellipsoid',       name:'Эллипсоид',        set:'solid'},
  {id:'prizma',          name:'Призма',           set:'solid'},
  {id:'parallelepiped',  name:'Параллелепипед',   set:'solid'},
];
const IMG = id => 'shapes/' + id + '.jpg';

const PRAISE = ['Молодец!','Отлично!','Верно!','Супер!','Так держать!','Здорово!'];
const OOPS   = ['Ой, не то!','Почти получилось!','Попробуешь в следующий раз!','Не беда!'];

/* ================= STATE ================= */
let mode = 'name';          // 'name' | 'picture'
let deck = [], idx = 0, score = 0, locked = false;
let lastSet = 'flat';

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr,n,excl) => shuffle(arr.filter(x=>x!==excl)).slice(0,n);

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = $(id);
  el.classList.add('active');
  el.style.animation='none'; void el.offsetWidth; el.style.animation='';
}

/* ================= BACKGROUND SHAPES ================= */
(function(){
  const host = $('#bgShapes');
  const kinds = ['circle','rect','half','stick','square'];
  const colors = ['#1798e8','#ffbeff','#ffe500'];
  const items = [];
  for(let i=0;i<14;i++){
    const el = document.createElement('div');
    const k = kinds[i%kinds.length];
    const c = colors[i%colors.length];
    const s = 40+Math.random()*110;
    el.className='bg-shape';
    el.style.background=c;
    el.style.left=Math.random()*100+'vw';
    el.style.top=Math.random()*100+'vh';
    if(k==='circle'){el.style.width=el.style.height=s+'px';el.style.borderRadius='50%';}
    else if(k==='half'){el.style.width=s+'px';el.style.height=s/2+'px';el.style.borderRadius=s+'px '+s+'px 0 0';}
    else if(k==='stick'){el.style.width=s*1.6+'px';el.style.height=s*.22+'px';el.style.borderRadius=s+'px';}
    else if(k==='square'){el.style.width=el.style.height=s*.8+'px';el.style.borderRadius=s*.18+'px';}
    else{el.style.width=s*1.3+'px';el.style.height=s*.5+'px';el.style.borderRadius=s*.2+'px';}
    host.appendChild(el);
    items.push({el, x:0, y:0, r:Math.random()*360,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, vr:(Math.random()-.5)*.3,
      sc:.9+Math.random()*.3});
  }
  (function tick(){
    for(const it of items){
      it.x+=it.vx; it.y+=it.vy; it.r+=it.vr;
      if(Math.abs(it.x)>120) it.vx*=-1;
      if(Math.abs(it.y)>120) it.vy*=-1;
      it.el.style.transform=`translate(${it.x}px,${it.y}px) rotate(${it.r}deg) scale(${it.sc})`;
    }
    requestAnimationFrame(tick);
  })();
})();

/* ================= CONFETTI ================= */
function confetti(x,y){
  const colors=['#1798e8','#ffbeff','#ffe500','#ff42e7','#3ddc84'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div');
    p.className='confetti';
    const s=6+Math.random()*9;
    p.style.width=s+'px'; p.style.height=s*(Math.random()>.5?1:.4)+'px';
    p.style.background=colors[i%colors.length];
    if(Math.random()>.6) p.style.borderRadius='50%';
    p.style.transform=`translate(${x}px,${y}px)`;
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2, v=3+Math.random()*7;
    let px=x, py=y, vx=Math.cos(a)*v, vy=Math.sin(a)*v-4, rot=Math.random()*360, life=0;
    (function fall(){
      life++; vy+=.35; px+=vx; py+=vy; rot+=vx*3;
      p.style.transform=`translate(${px}px,${py}px) rotate(${rot}deg)`;
      p.style.opacity=1-life/55;
      if(life<55) requestAnimationFrame(fall); else p.remove();
    })();
  }
}

/* ================= GAME FLOW ================= */
$('#modeToggle').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#modeToggle .push-btn').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  mode=b.dataset.mode;
});

document.querySelectorAll('.menu .push-btn').forEach(b=>{
  b.addEventListener('click', ()=>startGame(b.dataset.set));
});

function startGame(set){
  lastSet=set;
  let pool = set==='all' ? [...SHAPES] : SHAPES.filter(s=>s.set===set);
  shuffle(pool);
  if(set==='all') pool=pool.slice(0,12);
  deck=pool; idx=0; score=0;
  buildProgress();
  show('#screen-game');
  nextQuestion();
}

function buildProgress(){
  const p=$('#hudProgress'); p.innerHTML='';
  deck.forEach(()=>{const d=document.createElement('div');d.className='dot';p.appendChild(d);});
}

function nextQuestion(){
  locked=false;
  $('#feedback').textContent='';
  $('#hudScore').textContent=score;
  $('#hudStep').textContent=(idx+1)+'/'+deck.length;
  document.querySelectorAll('#hudProgress .dot').forEach((d,i)=>{
    d.classList.toggle('now', i===idx);
  });

  const q=deck[idx];
  const frame=$('#qFrame'), img=$('#qImg'), qText=$('#qText');
  const answers=$('#answers'); answers.innerHTML='';
  answers.classList.toggle('picture-answers', mode==='picture');
  frame.style.display = mode==='name' ? 'grid' : 'none';

  const wrongs=sample(SHAPES.filter(s=>s.id!==q.id),3);
  const options=shuffle([q,...wrongs]);

  if(mode==='name'){
    qText.innerHTML='Как называется эта фигура?';
    img.src=IMG(q.id); img.alt='Фигура';
    frame.classList.remove('pop'); void frame.offsetWidth; frame.classList.add('pop');
    options.forEach(o=>{
      const b=document.createElement('button');
      b.className='push-btn'; b.textContent=o.name;
      b.addEventListener('click',ev=>answer(b,o,q,ev));
      answers.appendChild(b);
    });
  } else {
    qText.innerHTML='Найди фигуру: <em>«'+q.name+'»</em>';
    options.forEach(o=>{
      const b=document.createElement('button');
      b.className='push-btn';
      const im=document.createElement('img');
      im.src=IMG(o.id); im.alt=o.name;
      b.appendChild(im);
      b.addEventListener('click',ev=>answer(b,o,q,ev));
      answers.appendChild(b);
    });
  }
}

function answer(btn, chosen, correct, ev){
  if(locked) return; locked=true;
  const buttons=[...$('#answers').children];
  const ok = chosen.id===correct.id;
  const dots=document.querySelectorAll('#hudProgress .dot');

  buttons.forEach(b=>{
    b.disabled=true;
    const isCorrectBtn = mode==='name'
      ? b.textContent===correct.name
      : b.querySelector('img').src.includes(correct.id);
    if(b===btn) b.classList.add(ok?'correct':'wrong');
    else if(isCorrectBtn && !ok) b.classList.add('correct');
    else if(b!==btn) b.classList.add('dim');
  });

  const fb=$('#feedback');
  if(ok){
    score++;
    $('#hudScore').textContent=score;
    dots[idx].classList.add('done');
    fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.className='feedback good';
    $('#qFrame').classList.remove('happy'); void $('#qFrame').offsetWidth; $('#qFrame').classList.add('happy');
    confetti(ev.clientX, ev.clientY);
  } else {
    dots[idx].classList.add('miss');
    fb.textContent=OOPS[Math.floor(Math.random()*OOPS.length)]+' Это «'+correct.name+'».';
    fb.className='feedback bad';
  }
  dots[idx].classList.remove('now');

  setTimeout(()=>{
    idx++;
    if(idx<deck.length) nextQuestion(); else finish();
  }, ok?1100:1900);
}

function finish(){
  show('#screen-result');
  const total=deck.length, ratio=score/total;
  $('#finalScore').innerHTML=score+'<small> / '+total+'</small>';
  const stars=$('#stars'); stars.innerHTML='';
  const n = ratio>=.9?3 : ratio>=.6?2 : ratio>=.3?1 : 0;
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.textContent='★';
    if(i>=n) s.classList.add('off');
    stars.appendChild(s);
  }
  $('#finalText').textContent =
    ratio===1   ? 'Идеально! Ты настоящий знаток геометрии!' :
    ratio>=.6   ? 'Отличный результат! Ещё чуть-чуть до идеала.' :
    ratio>=.3   ? 'Хорошее начало! Попробуй ещё раз.' :
                  'Не расстраивайся — посмотри на плакат и сыграй снова!';
  if(ratio>=.6) setTimeout(()=>confetti(innerWidth/2, innerHeight/3), 400);
}

$('#btnAgain').addEventListener('click',()=>startGame(lastSet));
$('#btnMenu').addEventListener('click',()=>show('#screen-start'));

/* preload */
SHAPES.forEach(s=>{const i=new Image();i.src=IMG(s.id);});
</script>
</body>
</html>
